[package]
name = "nft-mint-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nft-mint-cli"
path = "src/main.rs"

[dependencies]
solana-nft-mint = { path = "../programs/solana-nft-mint", features = ["no-entrypoint"] }
anchor-client = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
mpl-token-metadata = "5.1.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
